<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузчик видео</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
        }
        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        select, input, button {
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        input {
            flex: 1;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            cursor: pointer;
        }
        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .video-card {
            display: flex;
            gap: 10px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 10px;
            border-radius: 10px;
            align-items: center;
        }
        .video-card img {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }
        .info {
            flex: 1;
            overflow: hidden;
        }
        .info h4 {
            font-size: 13px;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info p {
            font-size: 11px;
            margin: 0 0 8px 0;
            opacity: 0.7;
        }
        .info button {
            padding: 5px 10px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h3 style="margin-top: 0;">Поиск и рекомендации</h3>

    <div class="search-container">
        <select id="platformSelect" onchange="switchPlatform()">
            <option value="youtube">YouTube</option>
            <option value="tiktok">TikTok</option>
        </select>
        <input type="text" id="searchInput" placeholder="Введите запрос...">
        <button onclick="handleSearch()">Найти</button>
    </div>

    <div id="results" class="results-grid">
        <p>Загрузка рекомендаций...</p>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        window.onload = function() {
            loadTrending();
        };

        function switchPlatform() {
            loadTrending();
        }

        async function loadTrending() {
            const platform = document.getElementById('platformSelect').value;
            const container = document.getElementById('results');
            container.innerHTML = '<p>Загрузка...</p>';

            try {
                if (platform === 'youtube') {
                    let res = await fetch('https://pipedapi.kavin.rocks/trending?region=RU');
                    let data = await res.json();
                    displayResults(data.items || [], 'youtube');
                } else {
                    let res = await fetch('https://www.tikwm.com/api/feed/list?count=10');
                    let data = await res.json();
                    displayResults(data.data || [], 'tiktok');
                }
            } catch (e) {
                container.innerHTML = '<p>Не удалось загрузить рекомендации.</p>';
            }
        }

        async function handleSearch() {
            const platform = document.getElementById('platformSelect').value;
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('results');
            
            if (!query) return;
            container.innerHTML = '<p>Ищем...</p>';

            try {
                if (platform === 'youtube') {
                    let res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
                    let data = await res.json();
                    displayResults(data.items || [], 'youtube');
                } else {
                    let res = await fetch(`https://www.tikwm.com/api/feed/search?keywords=${encodeURIComponent(query)}&count=10`);
                    let data = await res.json();
                    displayResults(data.data || [], 'tiktok');
                }
            } catch (e) {
                container.innerHTML = '<p>Ошибка поиска.</p>';
            }
        }

        function displayResults(items, platform) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p>Ничего не найдено.</p>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'video-card';

                if (platform === 'youtube') {
                    let videoUrl = `https://www.youtube.com${item.url}`;
                    card.innerHTML = `
                        <img src="${item.thumbnail}" alt="thumb">
                        <div class="info">
                            <h4>${item.title}</h4>
                            <p>${item.uploaderName || 'YouTube'}</p>
                            <button onclick="sendToBot('${videoUrl}')">Выбрать</button>
                        </div>
                    `;
                } else {
                    let videoUrl = `https://www.tiktok.com/@${item.author?.unique_id || 'user'}/video/${item.video_id}`;
                    card.innerHTML = `
                        <img src="${item.cover || item.origin_cover}" alt="thumb">
                        <div class="info">
                            <h4>${item.title || 'TikTok Видео'}</h4>
                            <p>@${item.author?.unique_id || 'author'}</p>
                            <button onclick="sendToBot('${videoUrl}')">Выбрать</button>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function sendToBot(url) {
            if (tg && tg.sendData) {
                tg.sendData(url);
            } else {
                alert("Выбрано: " + url);
            }
        }
    </script>
</body>
</html>
