<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubetok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #212121;
            --primary-color: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background-color: var(--surface-color); border-radius: var(--border-radius); padding: 25px; max-width: 400px; border: 1px solid #333; }
        h2 { margin-bottom: 15px; font-size: 20px; }
        p { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        button { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔥 Tubetok Downloader</h2>
        <p>Поиск и скачивание видео теперь работают напрямую через чат с ботом для максимальной стабильности!</p>
        <button onclick="closeApp()">Перейти в чат с ботом</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
